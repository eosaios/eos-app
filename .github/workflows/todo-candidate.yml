name: Todo clean installation acceptance

on:
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: choice
        options: [windows-amd64, linux-amd64]
      candidate_run:
        required: true
        type: string
      preflight:
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  clean-installation:
    name: Clean installation (${{ inputs.target }})
    runs-on: ${{ inputs.target == 'windows-amd64' && 'windows-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: todo-candidate-${{ inputs.target }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/todo-frozen
      - name: Install isolated Linux runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          PREFLIGHT: ${{ inputs.preflight }}
        run: |
          . /etc/os-release
          test "$VERSION_CODENAME" = noble
          sources="$RUNNER_TEMP/todo-ubuntu.sources"
          cat > "$sources" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
                   -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
                   -o DPkg::Lock::Timeout=45)
          sudo apt-get "${options[@]}" -o APT::Update::Error-Mode=any update
          documented='libgtk-4-1 libwebkitgtk-6.0-4 libx11-xcb1 libxkbcommon-x11-0 libxtst6'
          if [[ "$PREFLIGHT" != true ]]; then
            tar -xOzf "$RUNNER_TEMP"/todo-frozen/eos-todo_1.4.11_linux-amd64.tar.gz EOS-Todo/README.txt > "$RUNNER_TEMP/todo-install.txt"
            shipped=$(sed -n 's/^Install dependencies: sudo apt install //p' "$RUNNER_TEMP/todo-install.txt")
            test "$shipped" = "$documented"
          fi
          read -r -a packages <<< "$documented"
          sudo apt-get "${options[@]}" install -y "${packages[@]}"
          sudo apt-get "${options[@]}" install -y xvfb xauth dbus-x11
      - name: Verify clean installation of the frozen candidate
        shell: bash
        env:
          PLATFORM: ${{ inputs.target }}
        run: |
          display=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            display=(xvfb-run -a dbus-run-session)
          fi
          "${display[@]}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile
          
          platform = os.environ["PLATFORM"]
          root = Path(os.environ["RUNNER_TEMP"])
          candidate = root / "todo-frozen"
          manifest = json.loads((candidate / "release-manifest.json").read_text())
          receipt = json.loads((candidate / "verification.json").read_text())
          extension = "exe" if platform == "windows-amd64" else "tar.gz"
          package = candidate / f"eos-todo_1.4.11_{platform}.{extension}"
          assert manifest["file"] == package.name and manifest["platform"] == platform
          assert manifest["version"] == receipt["version"] == "1.4.11"
          assert all(receipt[key] is True for key in ("native_package_verified", "native_regressions_passed", "installer_lifecycle_passed"))
          assert hashlib.sha256(package.read_bytes()).hexdigest() == manifest["sha256"] == receipt["sha256"]
          
          if platform == "windows-amd64":
              import winreg
              destination = root / "Todo clean"
              binary = destination / "eos-todo.exe"
              protocol = r"Software\Classes\eostodo\shell\open\command"
              assert not destination.exists()
              try:
                  with winreg.OpenKey(winreg.HKEY_CURRENT_USER, protocol):
                      raise AssertionError("Todo protocol already registered")
              except FileNotFoundError:
                  pass
              subprocess.run([str(package), "/S", "/D=" + str(destination)], check=True)
              with winreg.OpenKey(winreg.HKEY_CURRENT_USER, protocol) as key:
                  assert str(binary).lower() in winreg.QueryValueEx(key, "")[0].lower()
          else:
              extracted = root / "todo-clean-extracted"
              binary = Path.home() / ".local/share/eos-todo/eos-todo"
              desktop = Path.home() / ".local/share/applications/eos-todo.desktop"
              assert not binary.exists() and not desktop.exists()
              with tarfile.open(package) as archive:
                  archive.extractall(extracted, filter="data")
              installer, = extracted.glob("*/install-user.sh")
              subprocess.run(["bash", str(installer)], check=True)
              assert "MimeType=x-scheme-handler/eostodo;" in desktop.read_text()
          info = json.loads(subprocess.check_output([str(binary), "--build-info"]))
          assert (info["version"], info["channel"], info["app_key"], info["environment"]) == ("1.4.11", "stable", "eos-todo", "production")
          assert json.loads(subprocess.check_output([str(binary), "--verify-package"]))["passed"] is True
          print(f"{platform}: native clean installation, application identity, and packaged runtime passed. SHA-256 {manifest['sha256']}")
          PY
