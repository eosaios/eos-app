name: Synchronize verified EOS Agent release
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preflight, sync]
        default: preflight
      version:
        required: true
        default: v1.0.19
      lock_sha256:
        description: SHA-256 of the approved release-lock.json (sync only)
        required: false
permissions:
  contents: read
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the approved release
        if: inputs.operation == 'sync'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md
      - name: Verify and synchronize stable packages
        env:
          EOS_ADMIN_EMAIL: ${{ secrets.EOS_ADMIN_EMAIL }}
          EOS_ADMIN_PASSWORD: ${{ secrets.EOS_ADMIN_PASSWORD }}
          OPERATION: ${{ inputs.operation }}
          VERSION: ${{ inputs.version }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
        run: python3 scripts/sync-agent-release.py --operation "$OPERATION" --version "$VERSION" --lock-sha256 "$LOCK_SHA256" --notes release-notes.md
