name: Todo candidate build (no portal promotion)
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: linux
        type: choice
        options: [linux, windows, publish]
      linux_run:
        default: ''
      windows_run:
        default: ''
      version:
        required: true
        default: '0.1.0-beta.14'
      pro_ref:
        required: true
        default: 'release/todo-0.1.0-beta.14-20261020'
      base_ref:
        required: true
        default: '5320733fe0cbf0f5abb501443c7ee2a682550e9c'
      core_ref:
        required: true
        default: '07c218bf5f9796a5ec93a8a15f7f55d5b4e54b4a'
permissions:
  contents: read
jobs:
  linux:
    if: inputs.mode == 'linux'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-todolist-pro
          ref: ${{ inputs.pro_ref }}
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-todolist-pro
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-todolist
          ref: ${{ inputs.base_ref }}
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-todolist
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-core-rs
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-core-rs
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: eos-todolist-pro/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eos-todolist/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev libx11-xcb-dev libxtst-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config libpipewire-0.3-dev libdrm-dev libgbm-dev libwayland-dev libxdo-dev
      - run: rustup toolchain install 1.93.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            eos-core-rs/target
          key: todo-linux-core-${{ inputs.core_ref }}
      - name: Build private Todo core
        working-directory: eos-core-rs
        run: cargo +1.93.1 build --release --locked -p eos-core-bin --bin eos-core-todo --features product-todo --target x86_64-unknown-linux-gnu
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            eos-core-rs/target
          key: todo-linux-core-${{ inputs.core_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: todo-linux-core
          path: eos-core-rs/target/x86_64-unknown-linux-gnu/release/eos-core-todo
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.17
      - working-directory: eos-todolist/frontend
        run: npm ci
      - name: Build and verify production candidate
        working-directory: eos-todolist-pro
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/build-platform.py --platform linux-amd64 --version "$VERSION" --base ../eos-todolist --core-source ../eos-core-rs --core ../eos-core-rs/target/x86_64-unknown-linux-gnu/release/eos-core-todo --output ../linux-output --test
      - uses: actions/upload-artifact@v4
        with:
          name: todo-linux-amd64
          path: linux-output/*
          if-no-files-found: error
  windows:
    if: inputs.mode == 'windows'
    runs-on: windows-latest
    steps:
      - name: Download private cross-built payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.EOS_CORE_PAT }}
        run: gh release download todo-candidate-0.1.0-beta.14-20261020 --repo eosaios/eos-todolist-pro --pattern windows-payload-v2.zip --dir inputs
      - name: Verify actual Windows executable and private core
        shell: pwsh
        run: |
          Expand-Archive inputs/windows-payload-v2.zip -DestinationPath payload
          python -c "import subprocess,json,pathlib; p=pathlib.Path('payload'); m=json.loads((p/'build-manifest.json').read_text()); i=json.loads(subprocess.check_output([str(p/'eos-todo.exe'),'--build-info'],timeout=20)); assert i['version']==m['version'] and i['environment']=='production' and i['api_origin']=='https://api.eosaios.com' and i['platform']=='windows-amd64'; v=json.loads(subprocess.check_output([str(p/'eos-todo.exe'),'--verify-package'],timeout=25)); assert v['passed']; print('Windows build identity and private core handshake passed')"
      - name: Package installer and verify extracted payload
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Path windows-output
          $stage = (Resolve-Path payload).Path
          $out = Join-Path (Resolve-Path windows-output).Path "eos-todo_$($env:VERSION)_windows-amd64.exe"
          $numeric = ($env:VERSION -split '-')[0] + '.0'
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /V2 "/DVERSION=$env:VERSION" "/DNUMERIC_VERSION=$numeric" "/DSTAGE=$stage" "/DICON=$stage\icon.ico" "/DOUTPUT=$out" payload/todo-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }
          7z x $out -oextracted -y | Out-Null
          python -c "import subprocess,json,pathlib,hashlib; p=pathlib.Path('extracted'); m=json.loads(pathlib.Path('payload/build-manifest.json').read_text()); assert hashlib.sha256((p/'eos-todo.exe').read_bytes()).hexdigest()==m['binary_sha256']; assert json.loads(subprocess.check_output([str(p/'eos-todo.exe'),'--verify-package'],timeout=25))['passed']; f=next(pathlib.Path('windows-output').glob('*.exe')); m.update(file=f.name,file_size=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest(),runtime_verified=True,distribution_ready=True); pathlib.Path('windows-output/release-manifest.json').write_text(json.dumps(m,indent=2)+'\n'); print('NSIS extracted payload verified')"
      - uses: actions/upload-artifact@v4
        with:
          name: todo-windows-amd64
          path: windows-output/*
          if-no-files-found: error
  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect three verified candidates
        env:
          GH_TOKEN: ${{ secrets.EOS_CORE_PAT }}
          LINUX_RUN: ${{ inputs.linux_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
        run: |
          set -euo pipefail
          mkdir -p candidate-assets/darwin-arm64 candidate-assets/linux-amd64 candidate-assets/windows-amd64
          gh run download "$LINUX_RUN" -R eosaios/eos-app --name todo-linux-amd64 --dir candidate-assets/linux-amd64
          gh run download "$WINDOWS_RUN" -R eosaios/eos-app --name todo-windows-amd64 --dir candidate-assets/windows-amd64
          gh release download todo-candidate-0.1.0-beta.14-20261020 -R eosaios/eos-todolist-pro --pattern 'eos-todo_*_darwin-arm64.dmg' --pattern mac-release-manifest.json --dir candidate-assets/darwin-arm64
          mv candidate-assets/darwin-arm64/mac-release-manifest.json candidate-assets/darwin-arm64/release-manifest.json
      - name: Store as non-current production versions
        env:
          EOS_ADMIN_API_BASE: ${{ secrets.EOS_ADMIN_API_BASE }}
          EOS_ADMIN_EMAIL: ${{ secrets.EOS_ADMIN_EMAIL }}
          EOS_ADMIN_PASSWORD: ${{ secrets.EOS_ADMIN_PASSWORD }}
        run: python3 scripts/todo-upload-candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: todo-download-addresses
          path: todo-downloads.json
          if-no-files-found: error
