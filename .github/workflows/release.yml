name: Todo candidate build (no portal promotion)
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: linux
        type: choice
        options: [linux, windows, preflight, publish]
      linux_run:
        default: ''
      windows_run:
        default: ''
      reuse_core_run:
        default: '39416514839'
      version:
        required: true
        default: '1.0.0'
      pro_ref:
        required: true
        default: 'release/todo-1.0.0-20261020'
      base_ref:
        required: true
        default: 'release/todo-1.0.0-20261020'
      core_ref:
        required: true
        default: '07c218bf5f9796a5ec93a8a15f7f55d5b4e54b4a'
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    if: inputs.mode == 'preflight'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify production version-management access without writes
        env:
          EOS_ADMIN_API_BASE: https://admin.eosaios.com
          EOS_ADMIN_EMAIL: ${{ secrets.EOS_ADMIN_EMAIL }}
          EOS_ADMIN_PASSWORD: ${{ secrets.EOS_ADMIN_PASSWORD }}
        run: python3 scripts/todo-upload-candidate.py --preflight
  linux:
    if: inputs.mode == 'linux'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-todolist-pro
          ref: ${{ inputs.pro_ref }}
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-todolist-pro
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-todolist
          ref: ${{ inputs.base_ref }}
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-todolist
      - uses: actions/checkout@v4
        with:
          repository: eosaios/eos-core-rs
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-core-rs
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: eos-todolist-pro/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: eos-todolist/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev libx11-xcb-dev libxtst-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config libpipewire-0.3-dev libdrm-dev libgbm-dev libwayland-dev libxdo-dev
      - run: rustup toolchain install 1.93.1 --profile minimal
        if: inputs.reuse_core_run == ''
      - uses: actions/cache@v4
        if: inputs.reuse_core_run == ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            eos-core-rs/target
          key: todo-linux-core-${{ inputs.core_ref }}
      - name: Build private Todo core
        if: inputs.reuse_core_run == ''
        working-directory: eos-core-rs
        run: cargo +1.93.1 build --release --locked -p eos-core-bin --bin eos-core-todo --features product-todo --target x86_64-unknown-linux-gnu
      - uses: actions/cache/save@v4
        if: inputs.reuse_core_run == ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            eos-core-rs/target
          key: todo-linux-core-${{ inputs.core_ref }}
      - name: Reuse immutable native core from this candidate build
        if: inputs.reuse_core_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_RUN: ${{ inputs.reuse_core_run }}
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          set -euo pipefail
          test "$CORE_RUN" = 39416514839
          test "$CORE_REF" = 07c218bf5f9796a5ec93a8a15f7f55d5b4e54b4a
          mkdir -p eos-core-rs/target/x86_64-unknown-linux-gnu/release
          gh run download "$CORE_RUN" -R eosaios/eos-app --name todo-linux-core --dir eos-core-rs/target/x86_64-unknown-linux-gnu/release
          echo '2dfd28e5f9a9ff26f1929694f619bb1e4fa32b3659135e49512f75420d6ade4a  eos-core-rs/target/x86_64-unknown-linux-gnu/release/eos-core-todo' | sha256sum --check
          chmod +x eos-core-rs/target/x86_64-unknown-linux-gnu/release/eos-core-todo
      - uses: actions/upload-artifact@v4
        with:
          name: todo-linux-core
          path: eos-core-rs/target/x86_64-unknown-linux-gnu/release/eos-core-todo
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.17
      - working-directory: eos-todolist/frontend
        run: npm ci
      - name: Build and verify production candidate
        working-directory: eos-todolist-pro
        env:
          VERSION: ${{ inputs.version }}
        run: xvfb-run -a python3 scripts/build-platform.py --platform linux-amd64 --version "$VERSION" --base ../eos-todolist --core-source ../eos-core-rs --core ../eos-core-rs/target/x86_64-unknown-linux-gnu/release/eos-core-todo --output ../linux-output --test
      - uses: actions/upload-artifact@v4
        with:
          name: todo-linux-amd64
          path: linux-output/*
          if-no-files-found: error
  windows:
    if: inputs.mode == 'windows'
    runs-on: windows-latest
    steps:
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Download private cross-built payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.EOS_CORE_PAT }}
        run: gh release download todo-candidate-1.0.0-20261020 --repo eosaios/eos-todolist-pro --pattern windows-payload.zip --dir inputs
      - name: Verify actual Windows executable and private core
        shell: pwsh
        run: |
          Expand-Archive inputs/windows-payload.zip -DestinationPath payload
          python -c "import subprocess,json,pathlib; p=pathlib.Path('payload'); m=json.loads((p/'build-manifest.json').read_text()); i=json.loads(subprocess.check_output([str(p/'eos-todo.exe'),'--build-info'],timeout=20)); assert i['version']==m['version'] and i['environment']=='production' and i['api_origin']=='https://api.eosaios.com' and i['platform']=='windows-amd64'; v=json.loads(subprocess.check_output([str(p/'eos-todo.exe'),'--verify-package'],timeout=25)); assert v['passed']; print('Windows build identity and private core handshake passed')"
      - name: Native Windows account flow and credential regression
        shell: pwsh
        run: |
          & payload/account.test.exe -test.v -test.timeout=120s
          if ($LASTEXITCODE -ne 0) { throw 'Windows account tests failed' }
          & payload/keyring.test.exe -test.v -test.timeout=30s
          if ($LASTEXITCODE -ne 0) { throw 'Windows credential tests failed' }
      - name: Package installer and verify extracted payload
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Path windows-output
          $stage = (Resolve-Path payload).Path
          # NSIS File directives require Windows separators on the native runner.
          $nsi = Get-Content payload/todo-installer.nsi | ForEach-Object { if ($_ -match '^\s*File ') { $_.Replace('/', '\') } else { $_ } }
          $nsi | Set-Content payload/todo-installer.nsi -Encoding utf8
          $out = Join-Path (Resolve-Path windows-output).Path "eos-todo_$($env:VERSION)_windows-amd64.exe"
          $numeric = ($env:VERSION -split '-')[0] + '.0'
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /V2 "/DVERSION=$env:VERSION" "/DNUMERIC_VERSION=$numeric" "/DSTAGE=$stage" "/DICON=$stage\icon.ico" "/DOUTPUT=$out" payload/todo-installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaging failed' }
          7z x $out -oextracted -y | Out-Null
          python -c "import subprocess,json,pathlib,hashlib; p=pathlib.Path('extracted'); m=json.loads(pathlib.Path('payload/build-manifest.json').read_text()); assert hashlib.sha256((p/'eos-todo.exe').read_bytes()).hexdigest()==m['binary_sha256']; assert json.loads(subprocess.check_output([str(p/'eos-todo.exe'),'--verify-package'],timeout=25))['passed']; f=next(pathlib.Path('windows-output').glob('*.exe')); m.update(file=f.name,file_size=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest(),runtime_verified=True,distribution_ready=True); pathlib.Path('windows-output/release-manifest.json').write_text(json.dumps(m,indent=2)+'\n'); print('NSIS extracted payload verified')"
      - name: Native install, reinstall and uninstall smoke
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = (Get-ChildItem windows-output/*.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'todo-install-smoke'
          $marker = Join-Path $env:APPDATA 'todo-user-data-preservation-smoke.txt'
          Set-Content $marker 'retain user data'
          1..2 | ForEach-Object {
            $p = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$target") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
            python -c "import subprocess,json; assert json.loads(subprocess.check_output([r'$target\eos-todo.exe','--verify-package'],timeout=25))['passed']"
          }
          $scheme = (Get-Item 'HKCU:\Software\Classes\eostodo\shell\open\command').GetValue('')
          if (!$scheme.Contains("$target\eos-todo.exe")) { throw 'Login return protocol is not registered to installed Todo' }
          $p = Start-Process -FilePath "$target\uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$target\eos-todo.exe") { throw 'Uninstall retained the executable' }
          if (!(Test-Path $marker)) { throw 'User data was removed' }
          Write-Output 'Install, reinstall, login protocol, private core and uninstall passed'
      - uses: actions/upload-artifact@v4
        with:
          name: todo-windows-amd64
          path: windows-output/*
          if-no-files-found: error
  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect three verified candidates
        env:
          GH_TOKEN: ${{ secrets.EOS_CORE_PAT }}
          LINUX_RUN: ${{ inputs.linux_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
        run: |
          set -euo pipefail
          mkdir -p candidate-assets/darwin-arm64 candidate-assets/linux-amd64 candidate-assets/windows-amd64
          gh run download "$LINUX_RUN" -R eosaios/eos-app --name todo-linux-amd64 --dir candidate-assets/linux-amd64
          gh run download "$WINDOWS_RUN" -R eosaios/eos-app --name todo-windows-amd64 --dir candidate-assets/windows-amd64
          gh release download todo-candidate-1.0.0-20261020 -R eosaios/eos-todolist-pro --pattern 'eos-todo_*_darwin-arm64.dmg' --pattern mac-release-manifest.json --dir candidate-assets/darwin-arm64
          mv candidate-assets/darwin-arm64/mac-release-manifest.json candidate-assets/darwin-arm64/release-manifest.json
      - name: Store as non-current production versions
        env:
          EOS_ADMIN_API_BASE: https://admin.eosaios.com
          EOS_ADMIN_EMAIL: ${{ secrets.EOS_ADMIN_EMAIL }}
          EOS_ADMIN_PASSWORD: ${{ secrets.EOS_ADMIN_PASSWORD }}
        run: python3 scripts/todo-upload-candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: todo-download-addresses
          path: todo-downloads.json
          if-no-files-found: error
