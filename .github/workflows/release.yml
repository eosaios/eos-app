name: Release

# EOS App 三端 Release 构建（Windows / macOS / Linux，五目标矩阵），
# 产物与校验文件发布到本仓库 Release。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.0.0-beta.2，留空则拒绝）"
        required: true
        default: ""
      publish:
        description: "验收通过后才公开发布；候选构建保持 false"
        type: boolean
        required: false
        default: false
      src_ref:
        description: "App 源码 ref（默认 main）"
        required: false
        default: "main"
      cli_ref:
        description: "CLI 依赖 ref（默认 main，建议使用已验证的提交）"
        required: false
        default: "main"
      core_ref:
        description: "Core 构建 ref（默认 main）"
        required: false
        default: "main"
      channel:
        description: "候选包通道；Dev/Beta 当前仅发布 Mac Apple Silicon"
        type: choice
        options: [stable, beta, dev]
        default: stable
      build_target:
        description: "构建目标；remaining-stable 保留已验收的 Mac ARM 包"
        type: choice
        options: [all, darwin-arm64, remaining-stable]
        default: all
      reuse_run_id:
        description: "Windows 构建恢复：复用此已完成运行的 macOS/Linux 产物，仅重建 Windows（正常发版留空）"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  GOPRIVATE: github.com/eosaios/*

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # 正常发版构建五目标；Windows 打包恢复只构建 Windows，复用其余四目标。
        # macOS Intel 使用 Intel runner 执行旧配置升级验收；Linux 使用 glibc 支持截图系统库。
        include: ${{ fromJSON(inputs.build_target == 'darwin-arm64' && '[{"goos":"darwin","goarch":"arm64","runner":"macos-latest","triple":"aarch64-apple-darwin"}]' || inputs.build_target == 'remaining-stable' && '[{"goos":"windows","goarch":"amd64","runner":"windows-latest","triple":"x86_64-pc-windows-gnu"},{"goos":"darwin","goarch":"amd64","runner":"macos-26-intel","triple":"x86_64-apple-darwin"},{"goos":"linux","goarch":"amd64","runner":"ubuntu-latest","triple":"x86_64-unknown-linux-gnu"},{"goos":"linux","goarch":"arm64","runner":"ubuntu-24.04-arm","triple":"aarch64-unknown-linux-gnu"}]' || inputs.reuse_run_id != '' && '[{"goos":"windows","goarch":"amd64","runner":"windows-latest","triple":"x86_64-pc-windows-gnu"}]' || '[{"goos":"windows","goarch":"amd64","runner":"windows-latest","triple":"x86_64-pc-windows-gnu"},{"goos":"darwin","goarch":"amd64","runner":"macos-26-intel","triple":"x86_64-apple-darwin"},{"goos":"darwin","goarch":"arm64","runner":"macos-latest","triple":"aarch64-apple-darwin"},{"goos":"linux","goarch":"amd64","runner":"ubuntu-latest","triple":"x86_64-unknown-linux-gnu"},{"goos":"linux","goarch":"arm64","runner":"ubuntu-24.04-arm","triple":"aarch64-unknown-linux-gnu"}]') }}

    steps:
      - name: Validate candidate channel
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel || 'stable' }}
          VERSION: ${{ inputs.version || github.ref_name }}
          BUILD_TARGET: ${{ inputs.build_target || 'all' }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = beta ]; then
            [[ "$VERSION" == *-beta.* && "$BUILD_TARGET" = darwin-arm64 && "$PUBLISH" != true ]] || { echo "::error::Beta requires its Mac candidate target and publish=false"; exit 1; }
          elif [ "$CHANNEL" = dev ]; then
            [[ "$VERSION" == *-dev.* && "$BUILD_TARGET" = darwin-arm64 && "$PUBLISH" != true ]] || { echo "::error::Dev requires its sandbox Mac candidate target and publish=false"; exit 1; }
          else
            [[ "$VERSION" != *-* ]] || { echo "::error::Stable version cannot be a prerelease"; exit 1; }
          fi

      # eos-app 的 go.mod replace github.com/eosaios/eos => ../eos-cli，
      # 布局必须保持 app 与 eos-cli 同级。
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: eosaios/eos-app-src
          ref: ${{ inputs.src_ref || 'main' }}
          token: ${{ secrets.EOS_CORE_PAT }}
          path: app

      - name: Checkout eos-cli (dependency)
        uses: actions/checkout@v4
        with:
          repository: eosaios/eos
          ref: ${{ inputs.cli_ref || 'main' }}
          path: eos-cli

      - name: Checkout core source
        uses: actions/checkout@v4
        with:
          repository: eosaios/eos-core-rs
          ref: ${{ inputs.core_ref || 'main' }}
          token: ${{ secrets.EOS_CORE_PAT }}
          path: eos-core-rs

      - name: Checkout release verification tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - name: Authenticate private Go dependencies
        shell: bash
        env:
          EOS_SOURCE_TOKEN: ${{ secrets.EOS_CORE_PAT }}
        run: git config --global url."https://x-access-token:${EOS_SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Rust target
        run: rustup target add ${{ matrix.triple }}

      - name: Install musl toolchain (linux musl)
        if: contains(matrix.triple, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Wails v3 beta.5 Linux 走 cgo，依赖 GTK4 + WebKitGTK 6.0（pkg-config 探测）。
      # GTK/WebKit 供桌面端 Go 构建；pipewire/drm/gbm/wayland 头文件供内核
      # xcap 截图链（wayland-sys/drm-sys/pipewire-sys 的 pkg-config 探测）。
      - name: Install GTK/WebKit headers (linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config libpipewire-0.3-dev libdrm-dev libgbm-dev libwayland-dev libxdo-dev xdg-utils desktop-file-utils

      # build_release.go 的 Windows syso 生成（图标/版本资源）依赖 wails3 CLI。
      - name: Install wails3 CLI (windows)
        if: matrix.goos == 'windows'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eos-core-rs
          key: ${{ matrix.triple }}
          cache-on-failure: true

      - name: Build sidecar (release)
        working-directory: eos-core-rs
        run: cargo build --release --target ${{ matrix.triple }} -p eos-core-bin

      - name: Sign and package sidecar
        shell: pwsh
        working-directory: eos-core-rs
        env:
          EOS_SIGNING_KEY: ${{ secrets.EOS_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EOS_SIGNING_KEY)) {
            throw "EOS_SIGNING_KEY secret 未设置"
          }
          $exeName = if ("${{ matrix.goos }}" -eq "windows") { "eos-core.exe" } else { "eos-core" }
          $built = "target/${{ matrix.triple }}/release/$exeName"
          $staged = "target/release/$exeName"
          New-Item -ItemType Directory -Force -Path (Split-Path $staged) | Out-Null
          Copy-Item -Force $built $staged
          New-Item -ItemType Directory -Force -Path scripts | Out-Null
          [IO.File]::WriteAllText("$PWD/scripts/eos-signing-key.pem", $env:EOS_SIGNING_KEY)
          & pwsh -NoProfile -File scripts/package-public-artifact.ps1 `
            -Target "${{ matrix.triple }}" `
            -PrivateKeyPath scripts/eos-signing-key.pem

      - name: Verify sidecar sha256
        shell: bash
        run: |
          set -euo pipefail
          dest="eos-core-rs/pkg/coreapi/sidecar/core/${{ matrix.triple }}"
          manifest_hash=$(python3 -c "import json; print(json.load(open('$dest/manifest.json'))['sha256'].replace('sha256:','').lower())" 2>/dev/null \
            || jq -r '.sha256' "$dest/manifest.json" | sed 's/^sha256://' | tr 'A-Z' 'a-z')
          bin_file=$(ls "$dest"/eos-core* | head -1)
          actual_hash=$(sha256sum "$bin_file" | awk '{print $1}')
          echo "manifest=$manifest_hash binary=$actual_hash"
          [ "$manifest_hash" = "$actual_hash" ] || { echo "::error::sha256 不一致"; exit 1; }

      - name: Stage sidecar into app core dir
        shell: bash   # Windows runner 默认 shell 是 pwsh，bash 语法必须显式声明
        run: |
          set -euo pipefail
          mkdir -p "app/core/${{ matrix.triple }}"
          cp "eos-core-rs/pkg/coreapi/sidecar/core/${{ matrix.triple }}"/eos-core* "app/core/${{ matrix.triple }}/"
          cp "eos-core-rs/pkg/coreapi/sidecar/core/${{ matrix.triple }}/manifest.json" "app/core/${{ matrix.triple }}/"

      - name: Build release archive
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          [ -n "$VERSION" ] || { echo "::error::版本号为空"; exit 1; }
          # 目标三元组显式下发（native runner 上与宿主一致；darwin/amd64 为交叉，
          # wails darwin 走 cgo，需 CC 指定 -arch x86_64）。
          export CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          if [ "${{ matrix.goos }}/${{ matrix.goarch }}" = "darwin/amd64" ]; then
            export CC="clang -arch x86_64"
          fi
          go run ./scripts/build_release.go \
            -channel "${{ inputs.channel || 'stable' }}" \
            -version "$VERSION" \
            -commit "$(git rev-parse HEAD)" \
            -build-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -out dist \
            -targets ${{ matrix.goos }}/${{ matrix.goarch }}
          ls -la dist

      # Windows 安装器：Inno Setup（installer.iss 与历版 setup 同源）。
      # 从 staging 取 exe（.iss 读 output\eos-app.exe），内核走已 staged 的
      # core\x86_64-pc-windows-gnu\。pwsh 调 iscc——bash 下 /D 会被 MSYS
      # 路径转换破坏。
      - name: Build Windows installer (Inno Setup)
        if: matrix.goos == 'windows'
        shell: pwsh
        working-directory: app
        run: |
          $version = "${{ inputs.version || github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version)) { throw "version 为空" }
          # staging 目录名走 build_release.go 的 sanitizeVersion：剥前导 v + 非法字符转连字符
          $dirVersion = $version.Trim().TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($dirVersion)) { $dirVersion = "dev" }
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Copy-Item -Force "dist/eos-app_${dirVersion}_windows-amd64/eos-app.exe" "output/eos-app.exe"
          & iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed (exit $LASTEXITCODE)" }
          Get-ChildItem dist

      - name: Verify Windows login protocol registration
        timeout-minutes: 5
        if: matrix.goos == 'windows'
        shell: pwsh
        working-directory: app
        run: |
          $version = "${{ inputs.version || github.ref_name }}"
          $install = Join-Path $env:RUNNER_TEMP "EOS-protocol-check"
          $installer = Resolve-Path "dist/eos-app-setup-$version.exe"
          # Start-Process -Wait also waits for the EOS client launched by Inno.
          # Wait only for the installer, then inspect the persisted URL handler.
          $process = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$install" -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill($true)
            throw "Windows installer did not exit within 120 seconds"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $command = (Get-Item 'HKCU:\Software\Classes\eosagent\shell\open\command').GetValue('')
          if ($command -ne "`"$install\eos-app.exe`" `"%1`"") { throw "Incorrect login protocol command: $command" }
          if (-not (Get-ItemProperty 'HKCU:\Software\Classes\eosagent').PSObject.Properties['URL Protocol']) { throw "Missing URL Protocol marker" }
          Get-Process eos-app,eos-core -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Output "Windows installer registered eosagent for the installed executable."

      - name: Verify Linux login protocol registration
        if: matrix.goos == 'linux'
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/eos-protocol-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/eos-protocol-config"
          mkdir -p "$XDG_CONFIG_HOME"
          VERSION="${{ inputs.version || github.ref_name }}"
          bash "dist/eos-app_${VERSION#v}_${{ matrix.goos }}-${{ matrix.goarch }}/install.sh"
          test -x "$XDG_DATA_HOME/eos-app/eos-app"
          test "$(xdg-mime query default x-scheme-handler/eosagent)" = eos-app.desktop
          grep -F 'MimeType=x-scheme-handler/eosagent;' "$XDG_DATA_HOME/applications/eos-app.desktop"

      - name: Verify packaged legacy upgrade and restart
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          PLATFORM="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = windows ]; then
            CORE="$RUNNER_TEMP/EOS-protocol-check/core/${{ matrix.triple }}/eos-core.exe"
            APP="$RUNNER_TEMP/EOS-protocol-check/eos-app.exe"
          elif [ "${{ matrix.goos }}" = linux ]; then
            CORE="$RUNNER_TEMP/eos-protocol-data/eos-app/core/${{ matrix.triple }}/eos-core"
            APP="$RUNNER_TEMP/eos-protocol-data/eos-app/eos-app"
          else
            NAME=EOS
            if [ "${{ inputs.channel }}" = beta ]; then NAME="EOS Beta"; fi
            if [ "${{ inputs.channel }}" = dev ]; then NAME="EOS Dev"; fi
            BUNDLE="dist/eos-app_${VERSION#v}_$PLATFORM/$NAME.app"
            codesign --verify --deep --strict "$BUNDLE"
            CORE="$BUNDLE/Contents/Resources/core/${{ matrix.triple }}/eos-core"
            APP="$BUNDLE/Contents/MacOS/eos-app"
          fi
          go version -m "$APP" > "dist/build-identity-$PLATFORM.txt"
          grep -F "vcs.revision=$(git rev-parse HEAD)" "dist/build-identity-$PLATFORM.txt"
          grep -F -- '-tags=eos_noembed,production' "dist/build-identity-$PLATFORM.txt"
          python3 scripts/verify_legacy_upgrade.py --core "$CORE" --manifest "$(dirname "$CORE")/manifest.json" --out "dist/upgrade-$PLATFORM.json"
          python3 tools/probe-model-proxy.py --core "$CORE" --out "$RUNNER_TEMP/model-proxy-$PLATFORM"
          cp "$RUNNER_TEMP/model-proxy-$PLATFORM/result.json" "dist/proxy-$PLATFORM.json"

      - name: Record packaged provenance
        shell: bash
        working-directory: app
        env:
          RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: python3 ../release-tools/scripts/record-app-build.py --channel "$RELEASE_CHANNEL" --version "$RELEASE_VERSION" --platform "${{ matrix.goos }}-${{ matrix.goarch }}" --triple "${{ matrix.triple }}"

      # build_release.go 会留下同名 staging 目录（exe+core 展开态），归档与
      # 安装器都取完后清掉，防止污染 release 资产。
      - name: Clean staging dirs
        shell: bash
        working-directory: app
        run: rm -rf dist/eos-app_*/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            app/dist/*.dmg
            app/dist/*.tar.gz
            app/dist/*.zip
            app/dist/*.exe
            app/dist/*.json
            app/dist/*.txt
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Download successful macOS and Linux artifacts
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-{darwin,linux}-*
          merge-multiple: true
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}

      - name: Verify complete distribution
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERNUM="${VERSION#v}"
          for file in "eos-app-setup-$VERSION.exe" "eos-app_${VERNUM}_windows-amd64.zip" \
            "eos-app_${VERNUM}_darwin-amd64.dmg" "eos-app_${VERNUM}_darwin-amd64.tar.gz" \
            "eos-app_${VERNUM}_darwin-arm64.dmg" "eos-app_${VERNUM}_darwin-arm64.tar.gz" \
            "eos-app_${VERNUM}_linux-amd64.tar.gz" "eos-app_${VERNUM}_linux-arm64.tar.gz"; do
            [ -s "dist/$file" ] || { echo "::error::缺少发行产物 $file"; exit 1; }
          done

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          NOTES_FILE="docs/releases/$VERSION.md"
          [ -s "$NOTES_FILE" ] || { echo "::error::缺少发布说明 $NOTES_FILE"; exit 1; }
          gh release create "$VERSION" dist/* \
            --title "EOS App $VERSION" \
            --notes-file "$NOTES_FILE" \
            --repo "$GITHUB_REPOSITORY"

  winget:
    # 发版后自动向 microsoft/winget-pkgs 提 manifest 更新 PR。
    # 前置：仓库 Settings → Secrets → 新建 WINGET_TOKEN（classic PAT，
    # 勾选 public_repo；用提交 winget PR 的 GitHub 账号生成，
    # 注意 PAT 过期后本 job 会失败，需要换新）。
    # 首次手动提交的 manifest 合并前，明确跳过更新并在摘要中说明。
    # WebView2 依赖（Microsoft.Edge.WebView2Runtime）暂不能声明：
    # winget-pkgs 策略不允许新版包带依赖，待包发布后单独提 PR 追加。
    name: Submit to winget-pkgs
    runs-on: windows-latest
    needs: release
    if: ${{ vars.WINGET_SUBMIT != 'off' }}
    steps:
      - name: Check package availability
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/e/EOSAIOS/EOSApp" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404) {
            "available=false" >> $env:GITHUB_OUTPUT
            "WinGet initial package is awaiting moderator approval: https://github.com/microsoft/winget-pkgs/pull/447303. No update was submitted." >> $env:GITHUB_STEP_SUMMARY
          } elseif ($response.StatusCode -eq 200) {
            "available=true" >> $env:GITHUB_OUTPUT
          } else {
            throw "WinGet package lookup failed: HTTP $($response.StatusCode)"
          }

      - name: Download wingetcreate
        if: steps.package.outputs.available == 'true'
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe -UseBasicParsing
          if (-not (Test-Path .\wingetcreate.exe)) { Write-Error "wingetcreate.exe download failed"; exit 1 }

      - name: Submit manifest update
        if: steps.package.outputs.available == 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $VERSION = "${{ inputs.version || github.ref_name }}"
          $verNum = $VERSION.TrimStart("v")
          # pwsh 不搜当前目录，必须 .\ 显式相对路径调用
          .\wingetcreate.exe update EOSAIOS.EOSApp `
            --version $verNum `
            --urls "https://github.com/${{ github.repository }}/releases/download/$VERSION/eos-app-setup-$VERSION.exe" `
            --token $env:WINGET_TOKEN `
            --submit

  admin-upload:
    # 发版后把五个平台安装包同步到管理后台版本管理（默认
    # https://api.eosaios.com），客户端更新检查的后台源以这里的
    # is_current 为权威（发布/回滚/灰度开关）。与 GitHub Release 双渠道
    # 保持同步全靠本 job，手动传后台仅作补漏。
    # 前置：仓库 Settings → Secrets 配三个值：
    #   EOS_ADMIN_API_BASE  形如 https://api.eosaios.com（不带尾斜杠）
    #   EOS_ADMIN_EMAIL     CI 专用管理账号邮箱
    #   EOS_ADMIN_PASSWORD  该账号密码
    # 开关：仓库 Variables 设 ADMIN_UPLOAD=off 可停用（发版事故隔离用）。
    # 同 (应用,平台,通道,版本) 重复上传返回 409，视为已同步打 WARNING 继续；
    # 其余非 200 直接 fail。
    name: Sync to admin version management
    runs-on: ubuntu-latest
    needs: release
    if: ${{ vars.ADMIN_UPLOAD != 'off' }}
    steps:
      - name: Upload assets to version management
        env:
          GH_TOKEN: ${{ github.token }}
          EOS_ADMIN_API_BASE: ${{ secrets.EOS_ADMIN_API_BASE }}
          EOS_ADMIN_EMAIL: ${{ secrets.EOS_ADMIN_EMAIL }}
          EOS_ADMIN_PASSWORD: ${{ secrets.EOS_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          VERNUM="${VERSION#v}"
          case "$VERSION" in *-beta*|*-rc*) QUALITY=beta ;; *) QUALITY=stable ;; esac
          API="${EOS_ADMIN_API_BASE%/}"
          AUTH="Authorization: Bearer $(curl -fsS "$API/api/v1/admin/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EOS_ADMIN_EMAIL\",\"password\":\"$EOS_ADMIN_PASSWORD\"}" \
            | jq -r '.data.access_token')"

          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern "eos-app-setup-$VERSION.exe" \
            --pattern "eos-app_${VERNUM}_darwin-amd64.dmg" \
            --pattern "eos-app_${VERNUM}_darwin-arm64.dmg" \
            --pattern "eos-app_${VERNUM}_linux-amd64.tar.gz" \
            --pattern "eos-app_${VERNUM}_linux-arm64.tar.gz"
          ls -la assets/

          NOTES=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          COMMIT="${{ inputs.src_ref || github.sha }}"

          ensure_application() {
            local platform="$1" display="$2" name="eos-app-$1" id
            id=$(curl -fsS "$API/api/v1/admin/version-management/applications" -H "$AUTH" \
              | jq -r --arg n "$name" '[.data.applications[] | select(.name==$n) | .id][0] // empty')
            if [ -z "$id" ]; then
              id=$(curl -fsS -X POST "$API/api/v1/admin/version-management/applications" \
                -H "$AUTH" -H 'Content-Type: application/json' \
                -d "{\"name\":\"$name\",\"app_key\":\"eos-app\",\"display_name\":\"$display\",\"platform\":\"$platform\",\"description\":\"EOS 桌面端\"}" \
                | jq -r '.data.id')
              echo "created application $name (id=$id)"
            fi
            echo "$id"
          }

          upload_asset() {
            local platform="$1" display="$2" file="$3" app_id code
            app_id=$(ensure_application "$platform" "$display")
            code=$(curl -s -o /tmp/upload-resp.json -w '%{http_code}' \
              -X POST "$API/api/v1/admin/version-management/versions/upload" -H "$AUTH" \
              -F "application_id=$app_id" -F "product_version=$VERNUM" -F "commit=$COMMIT" \
              -F "platform=$platform" -F "quality=$QUALITY" -F "release_notes=$NOTES" \
              -F "is_current=true" -F "file=@assets/$file")
            if [ "$code" = "200" ]; then
              echo "uploaded $platform <- $file (quality=$QUALITY)"
            elif [ "$code" = "409" ]; then
              echo "::error::$platform already exists; inspect existing row and checksum instead of replacing it"
              exit 1
            else
              echo "::error::$platform 上传失败 HTTP $code：$(cat /tmp/upload-resp.json)"
              exit 1
            fi
          }

          upload_asset windows-amd64 "EOS App (Windows x64)" "eos-app-setup-$VERSION.exe"
          upload_asset darwin-amd64 "EOS App (macOS Intel)" "eos-app_${VERNUM}_darwin-amd64.dmg"
          upload_asset darwin-arm64 "EOS App (macOS Apple Silicon)" "eos-app_${VERNUM}_darwin-arm64.dmg"
          upload_asset linux-amd64 "EOS App (Linux x64)" "eos-app_${VERNUM}_linux-amd64.tar.gz"
          upload_asset linux-arm64 "EOS App (Linux ARM64)" "eos-app_${VERNUM}_linux-arm64.tar.gz"
          echo "admin sync done: $VERNUM (quality=$QUALITY)"

